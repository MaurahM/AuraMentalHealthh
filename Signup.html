<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aura | Join Our Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a0b16; /* Darker for better contrast */
      --card-bg: rgba(59, 21, 52, 0.4);
      --accent: #ff2fa6;
      --accent-glow: rgba(255, 47, 166, 0.4);
      --muted: #bda7be;
      --white: #ffffff;
      --input-bg: rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--white);
      background: var(--bg);
      /* Animated background gradient */
      background: radial-gradient(circle at 0% 0%, #3b1534 0%, #1a0b16 50%, #2a0e24 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Left Side: Branding */
    .branding {
      flex: 1;
      padding: 60px;
      background: linear-gradient(135deg, rgba(255, 47, 166, 0.1) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .illustration-box {
      margin-bottom: 32px;
    }

    .headline {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(to right, #fff, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lead {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      font-weight: 300;
    }

    /* Right Side: Form */
    .form-section {
      flex: 1.2;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px 0;
      font-weight: 700;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: var(--input-bg);
      color: white;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 24px 0;
      font-size: 14px;
      color: var(--muted);
    }

    .checkbox-group input {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px -5px var(--accent-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px var(--accent-glow);
      filter: brightness(1.1);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: rgba(255, 255, 255, 0.2);
      font-size: 12px;
      text-transform: uppercase;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .divider:not(:empty)::before { margin-right: 15px; }
    .divider:not(:empty)::after { margin-left: 15px; }

    .google-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: white;
      color: #1a0b16;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .google-btn:hover {
      background: #f1f1f1;
      transform: translateY(-1px);
    }

    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--muted);
    }

    .footer-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
      min-height: 18px;
    }

    @media (max-width: 900px) {
      .container { flex-direction: column; margin: 20px; }
      .branding { padding: 40px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
      .form-section { padding: 40px; }
    }
  </style>
</head>
<body>

  <main class="container">
    <section class="branding">
      <div class="illustration-box">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="var(--accent)" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>
          <path d="M12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9-9 4.03-9 9 4.03 9 9 9z" fill="url(#grad1)" fill-opacity="0.2"/>
          <path d="M12 17v-6M9 14h6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:var(--accent);stop-opacity:1" />
              <stop offset="100%" style="stop-color:#5e1a4b;stop-opacity:1" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h2 class="headline">Meet Aura.<br>Your Mental Well-being Partner.</h2>
      <p class="lead">Step into a safe, private space. Our empathetic AI is ready to listen, support, and guide you 24/7.</p>
    </section>

    <section class="form-section">
      <h1>Create Account</h1>
      <p class="subtitle">Join thousands finding peace of mind.</p>

      <div id="error" class="error-msg" aria-live="polite"></div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" class="input-field" placeholder="aura_user" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" class="input-field" placeholder="hello@example.com" required />
        </div>

        <div style="display: flex; gap: 15px;">
            <div class="form-group" style="flex:1">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" class="input-field" placeholder="••••••••" required />
            </div>
            <div class="form-group" style="flex:1">
              <label for="confirm">Confirm</label>
              <input id="confirm" name="confirm" type="password" class="input-field" placeholder="••••••••" required />
            </div>
        </div>

        <div class="checkbox-group">
          <input id="terms" name="terms" type="checkbox" required />
          <label for="terms" style="margin:0; text-transform:none; font-weight:400">
            I agree to the <a href="#" style="color:var(--accent)">Terms of Service</a>
          </label>
        </div>

        <button id="submitBtn" class="btn-primary" type="submit">Get Started</button>

        <div class="divider">or continue with</div>

        <a href="https://auramentalhealthh-production.up.railway.app/api/auth/google" class="google-btn">
          <img src="https://www.svgrepo.com/show/355037/google.svg" width="18" alt="Google" />
          Google
        </a>

        <div class="footer-link">
          Already have an account? <a href="login.html">Log In</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('signupForm');
    const error = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';

      const pw = form.password.value;
      const confirmPw = form.confirm.value;

      if (!form.checkValidity()) {
        error.textContent = 'Please fill in all fields and accept the terms.';
        return;
      }

      if (pw.length < 8) {
        error.textContent = 'Password must be at least 8 characters.';
        return;
      }

      if (pw !== confirmPw) {
        error.textContent = 'Passwords do not match.';
        return;
      }

      const payload = {
        username: form.username.value.trim(),
        email: form.email.value.trim(),
        password: pw
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        const res = await fetch('https://auramentalhealthh-production.up.railway.app/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          error.textContent = data.message || 'Signup failed. Please try again.';
        } else {
          alert('Welcome to Aura!');
          window.location.href = 'login.html';
        }
      } catch (err) {
        error.textContent = 'Connection error. Please check your internet.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Get Started';
      }
    });
  </script>
</body>
</html>
