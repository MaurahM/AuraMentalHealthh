<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aura | Welcome Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a0b16;
      --card-bg: rgba(43, 16, 38, 0.6);
      --accent: #ff2fa6;
      --accent-glow: rgba(255, 47, 166, 0.4);
      --muted: #d1b8d3;
      --white: #ffffff;
      --input-bg: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--white);
      background: var(--bg);
      background: 
        radial-gradient(circle at 0% 0%, #3b1534 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, #4a1a41 0%, #1a0b16 50%),
        #1a0b16;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px; /* Slightly wider to accommodate form */
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* Left Side: Branding */
    .branding {
      flex: 1;
      padding: 60px 45px;
      background: linear-gradient(135deg, rgba(255, 47, 166, 0.1) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .main-logo {
      height: 100px;
      width: auto;
      filter: drop-shadow(0 0 15px var(--accent-glow));
      animation: float 5s ease-in-out infinite;
      margin-bottom: 25px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .headline {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lead {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      max-width: 260px;
    }

    /* Right Side: Action Area */
    .login-section {
      flex: 1.2;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: rgba(0, 0, 0, 0.1);
    }

    h1 { font-size: 32px; margin: 0 0 8px 0; font-weight: 800; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 30px; }

    /* Form Styles */
    form { width: 100%; display: flex; flex-direction: column; gap: 18px; }
    
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--muted); }
    
    input {
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 18px;
      border-radius: 12px;
      color: white;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px rgba(255, 47, 166, 0.15);
    }

    .login-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .login-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px var(--accent-glow);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 25px 0;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .divider:not(:empty)::before { margin-right: 15px; }
    .divider:not(:empty)::after { margin-left: 15px; }

    /* Google Button */
    .google-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: transparent;
      color: white;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .google-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .google-icon { width: 20px; height: 20px; }

    .footer-note {
      margin-top: 30px;
      font-size: 14px;
      text-align: center;
      color: var(--muted);
    }
    .footer-note a { color: var(--accent); text-decoration: none; font-weight: 700; }

    @media (max-width: 768px) {
      .container { flex-direction: column; margin: 10px; }
      .branding { padding: 40px 20px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
      .login-section { padding: 40px 25px; }
    }
  </style>
</head>
<body>

  <main class="container">
    <section class="branding">
      <img src="aura_logo.png" alt="Aura Logo" class="main-logo">
      <div class="headline">Aura Africa</div>
      <p class="lead">Your private space for mindfulness and emotional support.</p>
    </section>

    <section class="login-section">
      <h1>Welcome back</h1>
      <p class="subtitle">Please enter your details to sign in.</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" placeholder="name@example.com" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>

      <div class="divider">or</div>

      <button id="googleBtn" class="google-btn">
        <img src="https://www.svgrepo.com/show/355037/google.svg" class="google-icon" alt="Google Logo" />
        Continue with Google
      </button>

      <div id="error" class="error-msg"></div>

      <div class="footer-note">
        New here? <a href="Signup.html">Create an account</a>
      </div>
    </section>
  </main>

<script>
  const API_URL = 'https://auramentalhealthh-production.up.railway.app';
  const googleBtn = document.getElementById('googleBtn');

  // Google Login Logic
  googleBtn.addEventListener('click', () => {
    googleBtn.style.opacity = "0.7";
    googleBtn.innerText = "Redirecting...";
    setTimeout(() => {
        window.location.href = `${API_URL}/api/auth/google`;
    }, 300);
  });

  // Handle Form Submission (Placeholder for your actual Auth logic)
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Standard login triggered! Connect this to your /api/auth/login endpoint.');
  });
</script>

</body>
</html>
