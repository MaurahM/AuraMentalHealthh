<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aura | Welcome Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a0b16;
      --card-bg: rgba(59, 21, 52, 0.4);
      --accent: #ff2fa6;
      --accent-glow: rgba(255, 47, 166, 0.3);
      --muted: #bda7be;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--white);
      background: var(--bg);
      background: radial-gradient(circle at 100% 100%, #3b1534 0%, #1a0b16 50%, #2a0e24 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
    }

    /* Left Side: Illustration & Branding */
    .branding {
      flex: 1;
      padding: 60px 40px;
      background: linear-gradient(135deg, rgba(255, 47, 166, 0.08) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .illustration {
      margin-bottom: 30px;
      position: relative;
    }

    .illustration svg {
      filter: drop-shadow(0 0 20px var(--accent-glow));
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .headline {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 15px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .lead {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      font-weight: 300;
      max-width: 280px;
    }

    /* Right Side: Action Area */
    .login-section {
      flex: 1;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px 0;
      font-weight: 800;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 40px;
      text-align: center;
    }

    .google-btn {
      width: 100%;
      max-width: 300px;
      padding: 16px 24px;
      border-radius: 16px;
      border: none;
      background: var(--white);
      color: #1a0b16;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-decoration: none;
    }

    .google-btn:hover {
      transform: scale(1.03);
      background: #fcfcfc;
      box-shadow: 0 15px 30px rgba(255, 47, 166, 0.2);
    }

    .google-btn:active {
      transform: scale(0.98);
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

    .footer-note {
      margin-top: 30px;
      font-size: 14px;
      color: var(--muted);
    }

    .footer-note a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .footer-note a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    .error-msg {
      margin-top: 20px;
      color: #ff6b6b;
      font-size: 13px;
      min-height: 18px;
    }

    @media (max-width: 768px) {
      .container { flex-direction: column; margin: 10px; border-radius: 20px; }
      .branding { padding: 40px 20px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
      .login-section { padding: 50px 20px; }
    }
  </style>
</head>
<body>

  <main class="container">
    <section class="branding">
      <div class="illustration">
        <svg width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="var(--accent)" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4"/>
            <path d="M12 21a7 7 0 0 1-7-7c0-3.87 3.13-7 7-7v14z" fill="var(--accent)" fill-opacity="0.3"/>
            <path d="M12 21a7 7 0 0 0 7-7c0-3.87-3.13-7-7-7v14z" fill="var(--accent)"/>
            <path d="M12 4c-4.42 0-8 3.58-8 8a8 8 0 0 0 3 6.2M12 4c4.42 0 8 3.58 8 8a8 8 0 0 1-3 6.2" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8"/>
        </svg>
      </div>
      <div class="headline">Aura AI</div>
      <p class="lead">Your private space for mindfulness and emotional support.</p>
    </section>

    <section class="login-section">
      <h1>Welcome back</h1>
      <p class="subtitle">Please sign in to access your dashboard.</p>

      <button id="googleBtn" class="google-btn">
        <img src="https://www.svgrepo.com/show/355037/google.svg" class="google-icon" alt="Google Logo" />
        Continue with Google
      </button>

      <div id="error" class="error-msg"></div>

      <div class="footer-note">
        New here? <a href="Signup.html">Create an account</a>
      </div>
    </section>
  </main>

<script>
  const API_URL = 'https://auramentalhealthh-production.up.railway.app';
  const googleBtn = document.getElementById('googleBtn');
  const errorDiv = document.getElementById('error');

  googleBtn.addEventListener('click', () => {
    googleBtn.style.opacity = "0.7";
    googleBtn.innerText = "Redirecting...";
    
    // Smooth transition before redirect
    setTimeout(() => {
        window.location.href = `${API_URL}/api/auth/google`;
    }, 300);
  });

  // Handle potential URL error params (e.g., ?error=access_denied)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('error')) {
    errorDiv.textContent = 'Authentication failed. Please try again.';
  }
</script>

</body>
</html>
